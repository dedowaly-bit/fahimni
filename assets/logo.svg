  <path d="M102 96 q8 -14 16 0" fill="none" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
  <rect x="99" y="116" width="22" height="10" rx="4" fill="#6b7280"/>
  <rect x="102" y="126" width="16" height="7" rx="3" fill="#4b5563"/>

